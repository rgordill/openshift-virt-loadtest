---
# User-defined ClusterRole for the Argo CD Application Controller (cluster-scoped instance).
# Permissions are aggregated into the controller's admin role when:
# 1. spec.aggregatedClusterRoles is true on the ArgoCD CR, and
# 2. This ClusterRole has the label argocd/aggregate-to-admin: 'true' and labels
#    matching the Argo CD instance (managed-by = namespace, name = instance name).
# See: https://docs.redhat.com/en/documentation/red_hat_openshift_gitops/1.19/html/declarative_cluster_configuration/customizing-permissions-by-creating-aggregated-cluster-roles
#
# With aggregatedClusterRoles enabled, the controller no longer gets broad default
# write access — only what is listed here (plus the operator-managed view role).
# Include both platform resources (Namespace, Secret, Ingress, …) and every CRD
# API group this repo syncs.
#
# Apply before creating the app-of-apps: kubectl apply -f argocd/main/argocd-application-controller-operator-permissions-clusterrole.yaml
# Adjust labels if your Argo CD instance name or namespace differ from openshift-gitops.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-application-controller-operator-crds
  labels:
    app.kubernetes.io/managed-by: openshift-gitops
    app.kubernetes.io/name: openshift-gitops
    app.kubernetes.io/part-of: argocd
    argocd/aggregate-to-admin: "true"
rules:
  # Platform resources needed for CreateNamespace + operator/workload syncs
  - apiGroups: [""]
    resources:
      - namespaces
      - configmaps
      - secrets
      - services
      - serviceaccounts
      - pods
      - pods/log
      - endpoints
      - events
      - persistentvolumeclaims
      - persistentvolumes
      - limitranges
      - resourcequotas
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
    verbs: ["*"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["*"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["*"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["*"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["*"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["*"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csidrivers", "csinodes", "csistoragecapacities", "volumeattachments"]
    verbs: ["*"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["*"]
  - apiGroups: ["project.openshift.io"]
    resources: ["projects", "projectrequests"]
    verbs: ["*"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # OpenShift Virtualization / KubeVirt CRDs
  - apiGroups: ["kubevirt.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["hco.kubevirt.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["ssp.kubevirt.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["networkaddonsoperator.network.kubevirt.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["k8s.cni.cncf.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["clone.kubevirt.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["instancetype.kubevirt.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["pool.kubevirt.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["migrations.kubevirt.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["hostpathprovisioner.kubevirt.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["snapshot.kubevirt.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["export.kubevirt.io"]
    resources: ["*"]
    verbs: ["*"]
  # Monitoring CRs
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["*"]
    verbs: ["*"]
  # Snapshot support
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["*"]
    verbs: ["*"]
  # ODF / OCS CRDs
  - apiGroups: ["ocs.openshift.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["odf.openshift.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["ceph.rook.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["noobaa.io"]
    resources: ["*"]
    verbs: ["*"]
  # OLM (for managing Subscriptions/OperatorGroups via GitOps)
  - apiGroups: ["operators.coreos.com"]
    resources: ["*"]
    verbs: ["*"]
  # Elasticsearch (ECK)
  - apiGroups: ["elasticsearch.k8s.elastic.co"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["agent.k8s.elastic.co", "apm.k8s.elastic.co", "beat.k8s.elastic.co", "enterprisesearch.k8s.elastic.co", "kibana.k8s.elastic.co", "maps.k8s.elastic.co", "autoscaling.k8s.elastic.co", "logstash.k8s.elastic.co"]
    resources: ["*"]
    verbs: ["*"]
  # Grafana Operator
  - apiGroups: ["grafana.integreatly.org"]
    resources: ["*"]
    verbs: ["*"]
