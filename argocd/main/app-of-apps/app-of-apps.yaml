apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openshift-virt-loadtest-app
  namespace: openshift-gitops
spec:
  project: default
  sources:
    - repoURL: https://github.com/rgordill/openshift-virt-loadtest.git
      targetRevision: HEAD
      path: argocd/manifests/cluster-objects
    - repoURL: https://github.com/rgordill/openshift-virt-loadtest.git
      targetRevision: HEAD
      path: argocd/manifests/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
