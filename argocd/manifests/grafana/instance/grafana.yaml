# Grafana instance for kube-burner dashboards.
# root_url PLACEHOLDER is patched by ApplicationSet to https://grafana.<ingress-domain>
# Admin credentials are generated by the Grafana Operator (secret grafana-admin-credentials).
# PVC uses Azure managed-csi (not ODF/Ceph) so volumes attach on infra nodes.
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: elasticsearch
  labels:
    dashboards: grafana
    app: grafana
spec:
  config:
    log:
      mode: console
    auth:
      disable_login_form: "false"
    server:
      root_url: "https://PLACEHOLDER"
    rendering:
      server_url: http://127.0.0.1:8081/render
      callback_url: http://127.0.0.1:3000/
      renderer_token: "6c8d81fbde5f4d55df4b2f0b68c9c2b3374aefbd0c7bce6b86f12e8c2f5e7f51"
    plugins:
      preinstall_sync: elasticsearch@12.5.4
      preinstall_auto_update: "false"
  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
      storageClassName: managed-csi
  deployment:
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          nodeSelector:
            node-role.kubernetes.io/infra: ""
          tolerations:
            - key: node-role.kubernetes.io/infra
              value: reserved
              effect: NoSchedule
          containers:
            - name: grafana
              env:
                - name: GF_RENDERING_DEFAULT_IMAGE_WIDTH
                  value: "1920"
                - name: GF_RENDERING_DEFAULT_IMAGE_HEIGHT
                  value: "1080"
                - name: GF_RENDERING_DEFAULT_IMAGE_SCALE
                  value: "2"
            - name: image-renderer
              image: docker.io/grafana/grafana-image-renderer:latest
              env:
                - name: AUTH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: grafana-renderer-token
                      key: token
                - name: BROWSER_PAGE_SCALE_FACTOR
                  value: "2"
                - name: BROWSER_MIN_WIDTH
                  value: "1920"
                - name: BROWSER_MIN_HEIGHT
                  value: "540"
                - name: BROWSER_MAX_WIDTH
                  value: "3840"
                - name: BROWSER_MAX_HEIGHT
                  value: "-1"
                - name: BROWSER_PORTRAIT
                  value: "true"
                - name: GF_RENDERING_RENDERING_TIMEOUT
                  value: "120"
                - name: BROWSER_READINESS_TIMEOUT
                  value: "90s"
              resources:
                requests:
                  cpu: "500m"
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 2Gi
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc
