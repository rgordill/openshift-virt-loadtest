# Grafana UI — Ingress with edge TLS (prefer over OpenShift Route per kubernetes.mdc).
# Host PLACEHOLDER → grafana.<ingress-domain> via ApplicationSet.
# No tls.secretName: OpenShift router uses the cluster wildcard cert (same
# pattern as elasticsearch Ingress → Route, which needs no custom TLS secret).
# Edge is required because grafana-service speaks HTTP on :3000.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: elasticsearch
  labels:
    app: grafana
  annotations:
    route.openshift.io/termination: edge
    route.openshift.io/insecureEdgeTerminationPolicy: Redirect
spec:
  ingressClassName: openshift-default
  rules:
    - host: PLACEHOLDER
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-service
                port:
                  number: 3000
