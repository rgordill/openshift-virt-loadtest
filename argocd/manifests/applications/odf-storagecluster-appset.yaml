---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: odf-storagecluster
  namespace: openshift-gitops
spec:
  project: openshift-virt-loadtest
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/cluster-name: in-cluster
  template:
    metadata:
      name: 'odf-storagecluster'
      namespace: openshift-gitops
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    spec:
      project: openshift-virt-loadtest
      source:
        repoURL: https://github.com/rgordill/openshift-virt-loadtest.git
        targetRevision: HEAD
        path: argocd/manifests/odf/storagecluster
      destination:
        server: '{{.server}}'
        namespace: openshift-storage
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
