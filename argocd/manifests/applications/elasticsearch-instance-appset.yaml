---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: elasticsearch-instance
  namespace: openshift-gitops
spec:
  project: openshift-virt-loadtest
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/cluster-name: in-cluster
  template:
    metadata:
      name: 'elasticsearch-instance'
      namespace: openshift-gitops
      annotations:
        argocd.argoproj.io/sync-wave: "2"
        ingress-host: 'elasticsearch.{{ index .metadata.annotations "ingress-domain" }}'
    spec:
      project: openshift-virt-loadtest
      source:
        repoURL: https://github.com/rgordill/openshift-virt-loadtest.git
        targetRevision: HEAD
        path: argocd/manifests/elasticsearch/instance
        kustomize:
          patches:
            - target:
                kind: Ingress
                name: elasticsearch
              patch: |-
                - op: replace
                  path: /spec/rules/0/host
                  value: "elasticsearch.{{ index .metadata.annotations "ingress-domain" }}"
      destination:
        server: '{{.server}}'
        namespace: elasticsearch
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
