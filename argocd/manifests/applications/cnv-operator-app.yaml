---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnv-operator
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: openshift-virt-loadtest
  source:
    repoURL: https://github.com/rgordill/openshift-virt-loadtest.git
    targetRevision: HEAD
    path: argocd/manifests/openshift-virtualization/operator
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-cnv
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
